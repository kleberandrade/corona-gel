name: Java CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Autostart behavior and Linux single-instance tests
        run: python3 -m unittest discover -s tests -v
      - name: Headless example
        run: java -cp target/corona-gel.jar com.kleberandrade.coronagel.views.MainConsole
      - name: Generate example assets and test installation
        run: |
          java -Djava.awt.headless=true examples/GenerateImages.java "$RUNNER_TEMP/corona-images"
          java -Djava.awt.headless=true examples/GenerateImages.java "$RUNNER_TEMP/corona-portrait" --portrait
          java -Djava.awt.headless=true -cp target/corona-gel.jar examples/CapturePreview.java "$RUNNER_TEMP/corona-portrait" "$RUNNER_TEMP/application-preview.png"
          test -s "$RUNNER_TEMP/application-preview.png"
          ./install.sh "$RUNNER_TEMP/corona-app"
          test -x "$RUNNER_TEMP/corona-app/run.sh"
          test -f "$RUNNER_TEMP/corona-app/autostart.py"
          sh -n install.sh update.sh scripts/install.sh "$RUNNER_TEMP/corona-app/run.sh"
