name: GitHub Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'from scripts.package_release import ROOT, metadata; print(metadata(ROOT)[0])')
          test "$RELEASE_TAG" = "v$version"
          test -f "docs/releases/$RELEASE_TAG.md"
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - run: python3 -m unittest discover -s tests -v
      - name: Package and verify distribution
        run: |
          python3 scripts/package_release.py
          (cd target/release && sha256sum -c SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/release-smoke"
          tar -xzf target/release/corona-gel-*-linux-arm64.tar.gz -C "$RUNNER_TEMP/release-smoke"
          java -cp "$RUNNER_TEMP/release-smoke"/corona-gel-*/corona-gel.jar com.kleberandrade.coronagel.views.MainConsole
          sh -n "$RUNNER_TEMP/release-smoke"/corona-gel-*/run.sh
      - name: Upload draft assets and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" target/release/*.tar.gz target/release/SHA256SUMS \
            --verify-tag --draft --title "Corona Gel $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
